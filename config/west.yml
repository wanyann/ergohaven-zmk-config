manifest:
  remotes:
    - name: ergohaven
      url-base: https://github.com/ergohaven
    - name: wanyann
      url-base: https://github.com/wanyann
    - name: oleksandrmaslov
      url-base: https://github.com/oleksandrmaslov  
    - name: amgskobo
      url-base: https://github.com/amgskobo
  projects:
    - name: ergohaven-zmk
      remote: wanyann
      revision: main
      import: config/west.yml
    - name: zephyr
      remote: wanyann
      revision: phenom-mini/ws2812-irq-lock
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_silabs
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
    - name: zmk-pointing-acceleration
      remote: oleksandrmaslov
      revision: main
    - name: zmk-input-inertia
      remote: wanyann
      revision: main
  self:
    path: config
