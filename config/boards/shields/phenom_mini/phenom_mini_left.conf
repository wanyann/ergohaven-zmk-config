# =============================================================================
# Основные настройки сплита
# =============================================================================
CONFIG_ZMK_SPLIT=y

# ZMK автоматически включит USB (CONFIG_ZMK_USB=y) ТОЛЬКО для центральной 
# половины благодаря флагу -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y в build.yml.
# Явно прописывать CONFIG_ZMK_USB здесь НЕ НУЖНО, это ломает сборку периферии.

# =============================================================================
# USB Идентификаторы (из вашего QMK config.h)
# =============================================================================
CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=10
