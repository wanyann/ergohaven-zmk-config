CONFIG_ZMK_SPLIT=y

CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=10
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

CONFIG_ZMK_BLE=n
CONFIG_BT=n
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y

# CDC ACM TX ring buffer. cdc_acm_poll_out() drops the OLDEST buffered byte
# when the ring is full, so under log bursts (log thread flushes up to 8192 B
# every 100ms) the 1024 B default scrambles/drops log fragments. 8192 keeps a
# whole flush buffered.
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=8192
