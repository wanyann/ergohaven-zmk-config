CONFIG_ZMK_SPLIT=y

CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=10
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_ZMK_IDLE_TIMEOUT=180000
CONFIG_USB_DEVICE_REMOTE_WAKEUP=y
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

CONFIG_ZMK_BLE=n
CONFIG_BT=n
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_SPI=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

CONFIG_ZMK_LAYER_COLOR_INDICATOR=y

CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
